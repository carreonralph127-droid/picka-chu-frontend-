position:relative;

height:85vh;

display:flex;

align-items:center;
animation:;

width:500px;

box-shadow:0 0 60px yellow;

}

.right img{
    width:500px;
    position:relative;
    filter:drop-shadow(0 0 35px yellow);

}

@keyframes float{

0%{

transform:translateY(0);

}

50%{

transform:translateY(-30px);

}

100%{

transform:translateY(0);

}

}

#lightning{

position:absolute;

width:100%;

height:100%;

background:white;

opacity:0;

pointer-events:none;

}

animation:flash .25s;

}

0%{opacity:.9;}

100%{opacity:0;}

}

#pikachu{
    width: 450px;
    transition: transform .15s ease-out;
    filter: drop-shadow(0 0 30px yellow);
    transform-style: preserve-3d;
}
#rain{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

#nav{

    nimation:flash .25s;

}

    position: fixed;
    bottom: 25px;
    right: 25px;

    padding: 12px 20px;
    border: none;
    border-radius: 30px;

    background: rgba(255, 255, 255, 0.15);

</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pikachu </title>



</head>

<body>

<div class="overlay"></div>

<header>

<h1>⚡ Pikachu Universe ⚡</h1>

<nav>

<a href="home.html">Home</a>
<a href="#">Gallery</a>
<a href="#">Pokedex</a>
<a href="#">Contact</a>

</nav>

</header>


<section class="hero">

<div class="left">

<h2>The Strongest Electric Pokémon</h2>

<p>

Pikachu is one of the most famous Pokémon in the world.
Feel the power of electricity with beautiful animations.

</p>

<button id="btn">

Explore Now

</button>

</div>

<div class="right">

<img src="wewe-removebg-preview.png" id="pickachu">

<canvas id="rain"></canvas>

</div>

</section>

<div id="lightning"></div>

<audio id="bgMusic" loop>
    <source src="music/background.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">🎵 Music: OFF</button>

<script src="script.js"></script>

<script>
const flash = document.getElementById("lightning");

setInterval(()=>{

flash.classList.add("flash");

setTimeout(()=>{

flash.classList.remove("flash");

},200);

},5000);

const btn=document.getElementById("btn");

btn.onclick=()=>{

alert("⚡ Welcome to Pikachu Universe!");

}

const pika = document.getElementById("pickachu");

document.addEventListener("mousemove", (e) => {

    const x = (e.clientX - window.innerWidth / 2) / 20;
    const y = (e.clientY - window.innerHeight / 2) / 20;

    pika.style.marginLeft = x + "px";
    pika.style.marginTop = y + "px";

});Animation

const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const drops = [];

for (let i = 0; i < 300; i++) {
    drops.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: Math.random() * 20 + 10,
        speed: Math.random() * 10 + 10
    });
}

function drawRain() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(173,216,230,0.7)";
    ctx.lineWidth = 1;

    drops.forEach(drop => {

        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x - 2, drop.y + drop.length);
        ctx.stroke();

        drop.y += drop.speed;
        drop.x -= 1;

        if (drop.y > canvas.height) {
            drop.y = -20;
            drop.x = Math.random() * canvas.width;
        }

    });

    requestAnimationFrame(drawRain);
}

drawRain();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");

musicBtn.addEventListener("click", () => {
    if (music.paused) {
        music.play();
        musicBtn.textContent = "🎵 Music: ON";
    } else {
        music.pause();
        musicBtn.textContent = "🎵 Music: OFF";
    }
});

</script>

</body>
</html>
